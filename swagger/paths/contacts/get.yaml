get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getContacts
  description: >
    Returns a paginated list of contacts created by the authenticated user.
    Supports filtering (name, email, phoneNumber, contactType, isFavourite),
    sorting and pagination.
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      schema:
        type: integer
        example: 1
      description: Page number for pagination
    - name: perPage
      in: query
      schema:
        type: integer
        example: 10
      description: Number of contacts per page
    - name: sortBy
      in: query
      schema:
        type: string
        example: name
      description: Field to sort by (e.g. name, createdAt)
    - name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        example: asc
      description: Sort order
    - name: name
      in: query
      schema:
        type: string
      description: Filter contacts by name (partial match)
    - name: phoneNumber
      in: query
      schema:
        type: string
      description: Filter contacts by phone number (partial match)
    - name: email
      in: query
      schema:
        type: string
      description: Filter contacts by email (partial match)
    - name: isFavourite
      in: query
      schema:
        type: boolean
      description: Filter contacts by favourite status
    - name: contactType
      in: query
      schema:
        type: string
        enum: [work, home, personal]
      description: Filter contacts by contact type
  responses:
    '200':
      description: Successfully found contacts!
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contacts!
              data:
                type: object
                required:
                  - data
                  - page
                  - perPage
                  - totalItems
                  - totalPages
                  - hasNextPage
                  - hasPreviousPage
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/contact.yaml'
                  page:
                    type: integer
                    example: 1
                  perPage:
                    type: integer
                    example: 10
                  totalItems:
                    type: integer
                    example: 42
                  totalPages:
                    type: integer
                    example: 5
                  hasNextPage:
                    type: boolean
                    example: true
                  hasPreviousPage:
                    type: boolean
                    example: false
    '401':
      $ref: '../../components/responses/401.yaml'
