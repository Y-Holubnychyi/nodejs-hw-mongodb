tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: >
  Returns a list of contacts created by the authenticated user. Supports filtering, sorting and pagination.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      example: 1
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      example: 10
  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
      example: true
  - name: contactType
    in: query
    required: false
    schema:
      type: string
      enum: [home, work, personal]
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      example: name
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
responses:
  '200':
    description: Successful response
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                totalPages:
                  type: integer
                currentPage:
                  type: integer
                totalItems:
                  type: integer
  '401':
    $ref: '../../components/responses/401.yaml'
