patch:
  tags:
    - Contacts
  summary: Update a contact
  operationId: updateContact
  description: >
    Update fields of an existing contact. Accepts multipart/form-data to optionally replace the photo.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: ID of the contact to update
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Jane Doe
            email:
              type: string
              example: janedoe@example.com
            phoneNumber:
              type: string
              example: +380501234567
            contactType:
              type: string
              enum: [home, work, personal]
            isFavourite:
              type: boolean
              example: true
            photo:
              type: string
              format: binary
  responses:
    '200':
      description: Contact successfully updated
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully patched a contact!
              data:
                $ref: '../../components/schemas/contact.yaml'
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '../../components/responses/400.yaml'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../../components/responses/404.yaml'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/responses/401.yaml'
