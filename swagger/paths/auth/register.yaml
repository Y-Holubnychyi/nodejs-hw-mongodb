post:
  tags:
    - Auth
  summary: Register a new user
  operationId: registerUser
  description: Create a new user account.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - password
          properties:
            name:
              type: string
              example: Yevhenii
            email:
              type: string
              format: email
              example: user@example.com
            password:
              type: string
              example: mysecret123
  responses:
    '201':
      description: Successfully registered
    '409':
      description: Email already in use
