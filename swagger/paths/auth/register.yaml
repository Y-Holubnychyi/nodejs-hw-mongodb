tags:
  - Auth
summary: Register a new user
operationId: registerUser
description: Create a new user account.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            example: Yevhenii
          email:
            type: string
            format: email
            example: user@example.com
          password:
            type: string
            example: mysecret123
responses:
  '201':
    description: Successfully registered
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: User created successfully
            userId:
              type: string
  '409':
    description: Conflict - resource already exists
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: Email already in use
