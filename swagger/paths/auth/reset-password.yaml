tags:
  - Auth
summary: Reset user password
operationId: resetPassword
description: Resets password using a token sent via email.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
          password:
            type: string
            example: newpassword123
responses:
  '200':
    description: Password successfully reset
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Password updated
  '401':
    $ref: '../../components/responses/401.yaml'
