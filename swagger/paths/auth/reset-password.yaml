post:
  tags:
    - Auth
  summary: Reset user password
  operationId: resetPassword
  description: Resets password using a token sent via email.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - token
            - password
          properties:
            token:
              type: string
            password:
              type: string
              example: newpassword123
  responses:
    '200':
      description: Password successfully reset
    '401':
      description: Token invalid or expired
