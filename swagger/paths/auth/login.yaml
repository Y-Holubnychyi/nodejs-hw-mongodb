tags:
  - Auth
summary: Login a user
operationId: loginUser
description: Login with email and password.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: user@example.com
          password:
            type: string
            example: mysecret123
responses:
  '200':
    description: Login successful
    content:
      application/json:
        schema:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
  '401':
    $ref: '../../components/responses/401.yaml'
